<style>
  @font-face { font-family: 'Create Your Mark'; src: url('assets/CreateYourMark.otf') format('opentype'); font-display: swap; }
  html { margin: 0; padding: 0; background: #0b0a09; }
  body { margin: 0; padding: 0; background: #0b0a09; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  * { -webkit-tap-highlight-color: transparent; }
  a { color: #d8c7a4; text-decoration: none; }
  a:hover { color: #fff; }
  @keyframes rotatehint { 0%, 20% { transform: rotate(0deg) } 55%, 100% { transform: rotate(-90deg) } }
  @keyframes pulsering { 0% { transform: scale(1); opacity: .85 } 70% { transform: scale(1.45); opacity: 0 } 100% { transform: scale(1.45); opacity: 0 } }
  @keyframes smokedriftA { 0% { transform: translate3d(-6%, 3%, 0) scale(1.15) } 50% { transform: translate3d(4%, -4%, 0) scale(1.32) } 100% { transform: translate3d(-6%, 3%, 0) scale(1.15) } }
  @keyframes smokedriftB { 0% { transform: translate3d(5%, -2%, 0) scale(1.28) rotate(0deg) } 50% { transform: translate3d(-5%, 4%, 0) scale(1.12) rotate(4deg) } 100% { transform: translate3d(5%, -2%, 0) scale(1.28) rotate(0deg) } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes stepin { 0% { opacity: 0; transform: scale(.35) } 60% { opacity: 1; transform: scale(1.22) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes markin { from { opacity: 0 } to { opacity: 1; pointer-events: auto } }
</style>
</helmet>

  </sc-if>

  <sc-if value="{{ hasZoom }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeZoom }}" style="position: fixed; inset: 0; z-index: 40; background: rgba(6,5,4,.9); overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: flex; align-items: safe center; justify-content: safe center; gap: 0.5em; min-height: 100dvh; cursor: zoom-out; animation: fadeup .35s ease both;">
      <sc-if value="{{ hasCarousel }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ prevZoom }}" role="button" title="Предыдущее" style="flex: none; width: 2.6em; height: 2.6em; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(242,236,224,.4); border-radius: 999px; background: rgba(8,7,6,.6); backdrop-filter: blur(6px); font-family: system-ui, sans-serif; font-size: clamp(15px, 1.5vw, 22px); cursor: pointer;" style-hover="border-color: #fff; background: rgba(8,7,6,.85);">‹</div>
      </sc-if>
      <img onClick="{{ cycleZoom }}" src="{{ zoomSrc }}" alt="Материал" decoding="async" style="display: block; flex: none; margin-top: auto; margin-bottom: auto; max-width: {{ zoomMaxW }}; max-height: {{ zoomMaxH }}; height: {{ zoomH }}; width: auto; cursor: zoom-in; filter: drop-shadow(0 30px 70px rgba(0,0,0,.8));">
      <sc-if value="{{ hasCarousel }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ nextZoom }}" role="button" title="Следующее" style="flex: none; width: 2.6em; height: 2.6em; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(242,236,224,.4); border-radius: 999px; background: rgba(8,7,6,.6); backdrop-filter: blur(6px); font-family: system-ui, sans-serif; font-size: clamp(15px, 1.5vw, 22px); cursor: pointer;" style-hover="border-color: #fff; background: rgba(8,7,6,.85);">›</div>
      </sc-if>
      <div onClick="{{ closeZoom }}" role="button" style="position: fixed; right: 2.4vw; top: 2.6vh; width: 2.8em; height: 2.8em; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(242,236,224,.45); border-radius: 999px; background: rgba(8,7,6,.6); backdrop-filter: blur(6px); font-family: system-ui, sans-serif; font-size: clamp(13px, 1.35vw, 20px); cursor: pointer; z-index: 2;" style-hover="border-color: #fff;">✕</div>
      <sc-if value="{{ canZoomMore }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ cycleZoom }}" role="button" style="position: fixed; left: 50%; transform: translateX(-50%); bottom: max(2.4vh, 14px); display: flex; align-items: center; gap: 0.6em; padding: 0.55em 1.15em; border: 1px solid rgba(242,236,224,.35); border-radius: 999px; background: rgba(8,7,6,.62); backdrop-filter: blur(6px); font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-size: clamp(13px, 1.35vw, 20px); letter-spacing: 0.03em; cursor: pointer; z-index: 2;" style-hover="border-color: rgba(242,236,224,.85);">
          <span>Увеличить</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: {{ haze }}; transition: opacity 700ms cubic-bezier(.35,0,.3,1);">
    <div style="position: absolute; inset: -20%; background: radial-gradient(closest-side at 22% 38%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%), radial-gradient(closest-side at 68% 26%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%), radial-gradient(closest-side at 46% 74%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%), radial-gradient(closest-side at 84% 68%, rgba(255,255,255,.88), rgba(255,255,255,0) 74%); filter: blur(26px); animation: smokedriftA 9s ease-in-out infinite;"></div>
    <div style="position: absolute; inset: -20%; background: radial-gradient(closest-side at 12% 72%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%), radial-gradient(closest-side at 55% 12%, rgba(255,255,255,.85), rgba(255,255,255,0) 74%), radial-gradient(closest-side at 78% 88%, rgba(255,255,255,.92), rgba(255,255,255,0) 70%), radial-gradient(closest-side at 34% 48%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%); filter: blur(34px); animation: smokedriftB 11s ease-in-out infinite;"></div>
    <div style="position: absolute; inset: 0; background: rgba(255,255,255,.72);"></div>
  </div>

  <sc-if value="{{ needsRotate }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 90; background: #0b0a09; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.5dvh; padding: 8vw; text-align: center;">
      <div style="width: 92px; height: 148px; border: 3px solid #f2ece0; border-radius: 16px; animation: rotatehint 2.6s ease-in-out infinite; position: relative;">
        <span style="position: absolute; left: 50%; transform: translateX(-50%); top: 8px; width: 26px; height: 4px; border-radius: 2px; background: #f2ece0;"></span>
      </div>
      <div style="font-size: clamp(18px, 5.6vw, 30px); line-height: 1.5; max-width: 22ch;">Поверните устройство горизонтально</div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}">
class Component extends DCLogic {
  state = { screen: "intro", chapter: 2, typed: "", haze: 0, list: null, idx: 0, zoomStep: 0, needsRotate: false, hintOpen: false, showPlay: false };

  componentDidMount() {
    this.title = "Interactive\nmap";
    this.i = 0;
    this.tick = () => {
      if (this.i <= this.title.length) {
        this.setState({ typed: this.title.slice(0, this.i) });
        this.i++;
        this.timer = setTimeout(this.tick, this.i < 2 ? 700 : 115);
      }
    };
    this.typingStarted = false;
    this.startTyping = () => {
      if (this.typingStarted) return;
      this.typingStarted = true;
      this.timer = setTimeout(this.tick, 450);
    };
    this.videoEl = () => document.querySelector("video[data-waves]");
    this.kickVideo = () => {
      const v = this.videoEl();
      if (!v) return;
      v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
      v.setAttribute("webkit-playsinline", "true");
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    };
    // Safari не проигрывает медиа с серверов без поддержки Range-запросов —
    // тогда подгружаем файл целиком и подставляем blob-URL.
    this.blobTried = false;
    this.tryBlob = () => {
      if (this.blobTried) return;
      this.blobTried = true;
      fetch("assets/waves.mp4").then(r => r.blob()).then(b => {
        const v = this.videoEl();
        if (!v) return;
        v.src = URL.createObjectURL(new Blob([b], { type: "video/mp4" }));
        v.load();
        this.kickVideo();
      }).catch(() => {});
    };
    this.watchVideo = () => {
      const v = this.videoEl();
      if (!v || this.state.screen !== "intro") return;
      this.kickVideo();
      const stalled = v.readyState < 2 || v.paused || v.currentTime === 0;
      if (!stalled) this.startTyping();
      if (v.error && v.error.code) this.tryBlob();
      if (stalled && !this.state.showPlay && Date.now() - this.mountedAt > 5000) this.setState({ showPlay: true });
      if (!stalled && this.state.showPlay) this.setState({ showPlay: false });
    };
    this.mountedAt = Date.now();
    setTimeout(this.startTyping, 1200);
    this.vidTimer = setInterval(this.watchVideo, 900);
    this.kickVideo();
    this.checkOrient = () => {
      const w = window.innerWidth, h = window.innerHeight;
      const touch = window.matchMedia("(any-pointer: coarse)").matches || (navigator.maxTouchPoints || 0) > 0;
      // портрет определяем и по медиа-запросу, и по размерам: на iOS они обновляются с задержкой
      const portraitMQ = window.matchMedia("(orientation: portrait)").matches;
      const handheld = touch && Math.min(w, h) <= 1200;
      const want = handheld && (portraitMQ || h > w);
      if (want !== this.state.needsRotate) this.setState({ needsRotate: want });
    };
    this.checkOrient();
    [120, 400, 900].forEach(ms => setTimeout(this.checkOrient, ms));
    this.orientTimer = setInterval(this.checkOrient, 700);
    window.addEventListener("resize", this.checkOrient);
    window.addEventListener("orientationchange", this.checkOrient);
    window.addEventListener("pageshow", this.checkOrient);
    document.addEventListener("visibilitychange", this.checkOrient);
    const mq = window.matchMedia("(orientation: portrait)");
    if (mq.addEventListener) mq.addEventListener("change", this.checkOrient);
    this.onKey = (e) => {
      if (!this.state.list) return;
      if (e.key === "ArrowRight") this.step(1);
      if (e.key === "ArrowLeft") this.step(-1);
      if (e.key === "Escape") this.setState({ list: null, idx: 0, zoomStep: 0 });
    };
    window.addEventListener("keydown", this.onKey);
  }

  componentWillUnmount() {
    clearInterval(this.vidTimer);
    clearTimeout(this.hintTimer);
    clearTimeout(this.timer);
    clearTimeout(this.hazeTimer);
    clearInterval(this.orientTimer);
    window.removeEventListener("resize", this.checkOrient);
    window.removeEventListener("orientationchange", this.checkOrient);
    window.removeEventListener("pageshow", this.checkOrient);
    document.removeEventListener("visibilitychange", this.checkOrient);
    window.removeEventListener("keydown", this.onKey);
  }

  step(d) {
    const l = this.state.list;
    if (!l || l.length < 2) return;
    this.setState({ idx: (this.state.idx + d + l.length) % l.length, zoomStep: 0 });
  }

  go(screen, chapter) {
    if (this.state.haze) return;
    this.setState({ haze: 1, list: null, idx: 0, hintOpen: false });
    this.hazeTimer = setTimeout(() => {
      if (window.scrollTo) window.scrollTo(0, 0);
      this.setState(chapter ? { screen, chapter } : { screen });
      this.hazeTimer = setTimeout(() => this.setState({ haze: 0 }), 60);
    }, 640);
  }

  renderVals() {
    const open = (list, idx) => () => { this.setState({ list, idx, zoomStep: 0 }); if (window.scrollTo) window.scrollTo(0, 0); };
    const ch1 = ["assets/polaroid-1.png", "assets/polaroid-2.png", "assets/polaroid-3.png"];
    const safir = ["assets/safir-p2.png", "assets/safir-p1.png", "assets/safir-p4.png", "assets/safir-p3.png"];
    const hayran = ["assets/hayran-p1.png", "assets/hayran-p2.png", "assets/hayran-p3.png", "assets/hayran-p4.png", "assets/hayran-p5.png", "assets/hayran-p6.png"];
    const hguide = ["assets/hayran-1.png", "assets/hayran-2.png"];
    const list = this.state.list;
    const src = list ? list[this.state.idx] : "";
    const isDoc = /odiha|safir\.png|hayran-1|hayran-2|hayran-menu/.test(src);
    const s = this.state.screen;
    return {
      yes: true,
      isIntro: s === "intro",
      isMap: s === "map",
      isMap1: s === "map" && this.state.chapter === 1,
      isMap2: s === "map" && this.state.chapter === 2,
      isOdiha: s === "odiha",
      isSafir: s === "safir",
      isHayran: s === "hayran",
      isSlide: s === "odiha" || s === "safir" || s === "hayran",
      ch1Dim: this.state.chapter === 1 ? 1 : 0.55,
      ch2Dim: this.state.chapter === 2 ? 1 : 0.55,
      ch1Frame: this.state.chapter === 1 ? "rgba(242,236,224,.9)" : "transparent",
      ch2Frame: this.state.chapter === 2 ? "rgba(242,236,224,.9)" : "transparent",
      typed: this.state.typed,
      haze: this.state.haze,
      needsRotate: this.state.needsRotate,
      hasZoom: !!list,
      hasCarousel: !!list && list.length > 1,
      zoomSrc: src,
      zoomH: this.state.zoomStep === 0 ? "auto" : "190dvh",
      zoomMaxW: this.state.zoomStep !== 0 ? "none" : (list && list.length > 1 ? "calc(100vw - 8.5em)" : "100vw"),
      zoomMaxH: this.state.zoomStep === 0 ? "100dvh" : "none",
      canZoomMore: this.state.zoomStep === 0 && isDoc,
      cycleZoom: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        if (isDoc && this.state.zoomStep === 0) this.setState({ zoomStep: 1 });
      },
      prevZoom: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.step(-1); },
      nextZoom: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.step(1); },
      closeZoom: () => this.setState({ list: null, idx: 0, zoomStep: 0 }),
      enterMap: () => this.go("map"),
      goCh1: () => { if (this.state.chapter !== 1) this.go("map", 1); },
      goCh2: () => { if (this.state.chapter !== 2) this.go("map", 2); },
      openOdiha: () => this.go("odiha"),
      openSafir: () => this.go("safir"),
      openHayran: () => this.go("hayran"),
      backToMap: () => this.go("map"),
      zoomOdiha: open(["assets/odiha.png"], 0),
      zoomTicket: open(["assets/ticket.png"], 0),
      zoomP1: open(ch1, 0),
      zoomP2: open(ch1, 1),
      zoomP3: open(ch1, 2),
      zoomSafir: open(["assets/safir.png"], 0),
      zoomSP3: open(safir, 0),
      zoomSP4: open(safir, 1),
      zoomSP1: open(safir, 2),
      zoomSP2: open(safir, 3),
      zoomHGuide: open(hguide, 0),
      zoomHMenu: open(["assets/hayran-menu.png"], 0),
      zoomHP1: open(hayran, 0),
      zoomHP2: open(hayran, 1),
      zoomHP3: open(hayran, 2),
      zoomHP4: open(hayran, 3),
      zoomHP5: open(hayran, 4),
      zoomHP6: open(hayran, 5),
      hintOpen: this.state.hintOpen,
      showPlay: this.state.showPlay,
      startVideo: () => {
        const v = this.videoEl();
        if (v) { v.muted = true; v.load(); }
        this.blobTried = false;
        this.kickVideo();
        setTimeout(() => { const el = this.videoEl(); if (el && (el.readyState < 2 || el.paused)) this.tryBlob(); }, 500);
        this.setState({ showPlay: false });
      },
      toggleHint: () => {
        const open = !this.state.hintOpen;
        clearTimeout(this.hintTimer);
        if (open) this.hintTimer = setTimeout(() => this.setState({ hintOpen: false }), 3600);
        this.setState({ hintOpen: open });
      },
      closeHint: () => this.setState({ hintOpen: false })
    };
  }
}
</script>
